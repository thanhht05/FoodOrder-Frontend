server {
    listen 80;
    server_name localhost my-demo.id.vn www.my-demo.id.vn;

    # 1. Phục vụ giao diện React Single Page Application (SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Chuyển tiếp các request gọi API sang Spring Boot Backend
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Hỗ trợ kết nối thời gian thực WebSocket (Chatbot, Thông báo đơn hàng)
    location /ws/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. Phục vụ file ảnh upload từ backend
    location /upload/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
    }

    # Nén Gzip tăng tốc độ tải trang
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
