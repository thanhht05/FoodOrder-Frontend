name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # GIAI ĐOẠN 1: CONTINUOUS INTEGRATION (Kiểm tra Build Vite)
  # -------------------------------------------------------------
  ci-build:
    name: Build & Verify Vite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Compile & Build Vite (Dry-run)
        run: npm run build
        env:
          VITE_BACKEND_URL: https://my-demo.id.vn
          VITE_GOOGLE_CLIENT_ID: 250171075174-lg64eg4a9vjgbjj9pnqh10phom6l1hiq.apps.googleusercontent.com

  # -------------------------------------------------------------
  # GIAI ĐOẠN 2: CONTINUOUS DEPLOYMENT (Triển khai lên VPS)
  # -------------------------------------------------------------
  cd-deploy:
    name: Deploy Frontend to Azure VPS
    needs: ci-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 SSH to VPS and Deploy Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 10m
          script: |
            set -e
            echo "=== [FRONTEND] BẮT ĐẦU TRIỂN KHAI TỰ ĐỘNG ==="
            
            # Ưu tiên chạy deploy script nếu đã tạo trên VPS, nếu chưa sẽ chạy lệnh trực tiếp
            if [ -f /opt/food-order/deploy.sh ]; then
              echo ">> Thực thi /opt/food-order/deploy.sh frontend..."
              /opt/food-order/deploy.sh frontend
            else
              PROJECT_DIR="${{ secrets.VPS_PROJECT_DIR }}"
              if [ -z "$PROJECT_DIR" ]; then PROJECT_DIR="/opt/food-order"; fi
              
              echo ">> Đồng bộ mã nguồn frontend..."
              cd "$PROJECT_DIR/FoodOrder-Frontend"
              git fetch origin main
              git reset --hard origin/main
              
              echo ">> Rebuild container frontend..."
              cd "$PROJECT_DIR"
              docker-compose up -d --build --no-deps frontend
              
              echo ">> Dọn dẹp Docker Image rác..."
              docker image prune -f
            fi
            
            echo "=== [FRONTEND] TRIỂN KHAI THÀNH CÔNG! ==="
